# Valores para el chart oficial de HashiCorp (namespace "vault", nombre de la
# dependencia en Chart.yaml).
vault:
  server:
    # "raft" es el almacenamiento integrado propio de Vault (sin depender de
    # Consul aparte) — es el recomendado incluso para un solo nodo como este.
    # El chart lo activa dentro del bloque "ha", aunque aquí solo tengamos
    # una réplica (no es alta disponibilidad real, es aprendizaje en local).
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true

    dataStorage:
      enabled: true
      size: 1Gi

  ui:
    enabled: true # panel web de Vault, útil para ver los secretos visualmente

  injector:
    # El "injector" es otra forma de consumir secretos (vía sidecar en cada
    # Pod que los necesite) — no la usamos, vamos con External Secrets
    # Operator en su lugar, así que lo desactivamos para no gastar recursos.
    enabled: false
