# Valores para el chart de Bitnami (namespace "postgresql" porque es el
# nombre de la dependencia declarada en Chart.yaml).
postgresql:
  image:
    # Bitnami movió su catálogo gratuito a este registro "legacy" (snapshot
    # congelado) a mediados de 2025; el registro por defecto del chart ya
    # requiere suscripción de pago. Ver Chart.yaml.
    registry: docker.io
    repository: bitnamilegacy/postgresql

  auth:
    # Sin contraseñas en texto plano: las trae External Secrets Operator
    # desde Vault (secret/postgres) al Secret "postgres-credentials", ver
    # platform/secrets/externalsecret-postgres.yaml. Las claves
    # "postgres-password"/"password" ya son las que usa el chart por
    # defecto (secretKeys.*), no hace falta indicarlas aparte.
    existingSecret: postgres-credentials
    username: car_api # primer usuario/BD lógica creada al arrancar (no es secreto)
    database: car_api
    # NOTA: el chart de Bitnami solo crea UN usuario/BD extra en el primer
    # arranque (los de arriba). Cuando llegue sport-api, hará falta añadir un
    # script de init (postgresql.primary.initdb.scripts) para crear su propio
    # usuario/BD sin tocar los de car_api ya existentes.

  primary:
    persistence:
      size: 1Gi
