apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-in-one/gitops.git
    targetRevision: main
    path: platform/kyverno
    helm:
      releaseName: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno declara CRDs muy grandes (ej. ClusterPolicy, con todo su
      # esquema de validación embebido) — con el "kubectl apply" normal
      # (client-side, que guarda la configuración completa anterior en una
      # anotación) esto falla con "metadata.annotations: Too long: must have
      # at most 262144 bytes". ServerSideApply es la solución recomendada
      # por el propio proyecto Kyverno para instalarse vía ArgoCD.
      - ServerSideApply=true
  # Falsos positivos conocidos en las CRDs de Kyverno, verificados campo a
  # campo con "helm template" + comparación contra el recurso real antes
  # de ignorarlos (no a ciegas):
  # - spec/conversion: el API server lo añade por defecto
  #   ("{strategy: None}") a cualquier CRD que no lo declare explícitamente.
  # - metadata/labels y metadata/annotations: en las CRDs del motor CEL de
  #   Kyverno (ImageValidatingPolicy, ValidatingPolicy...) el chart
  #   renderiza mapas vacíos ("labels: {}", "annotations: {}"), pero
  #   Kubernetes omite la clave por completo cuando está vacía en vez de
  #   guardarla como "{}" — mismo objeto, distinta serialización. Las CRDs
  #   más antiguas (ClusterPolicy...) sí traen labels/annotations reales
  #   del chart y nunca dieron este falso positivo.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /metadata/labels
        - /metadata/annotations
