apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: car-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-in-one/car-api.git
    targetRevision: main
    path: chart
    helm:
      releaseName: car-api
      # El Secret "car-api" (con DATABASE_URL) ya no lo crea este values
      # override — lo crea External Secrets Operator desde Vault, ver
      # platform/secrets/externalsecret-car-api.yaml.
      valuesObject:
        image:
          # Tag inmutable del commit publicado — con "latest" (el valor por
          # defecto del chart) Kubernetes no detecta que hay imagen nueva y
          # no la redespliega. Ver gitops/apps/web.yaml y log.md 2026-08-27.
          tag: sha-61c886a
        ingress:
          enabled: true
          # Un único host para toda la plataforma (web + APIs), servido por
          # ingress-nginx (ver gitops/apps/ingress-nginx.yaml). El prefijo
          # /api/car-api solo existe aquí, a nivel de Ingress — car-api no
          # sabe nada de él, sigue respondiendo en /health, /maintenance-events...
          host: juan-in-one.local
          path: "/api/car-api(/|$)(.*)"
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /$2
        imagePullSecrets:
          # Secret dockerconfigjson creado directo en el clúster (no en Git,
          # namespace car-api) con credenciales de lectura del paquete
          # privado de GHCR: kubectl create secret docker-registry ghcr-pull...
          - name: ghcr-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: car-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
