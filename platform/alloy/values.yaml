# Valores para el chart oficial (dependencia "alloy" declarada en Chart.yaml
# — de ahí la primera clave "alloy:" de más abajo, mismo patrón que
# "kube-prometheus-stack:"/"loki:" en los otros wrappers de platform/).
#
# OJO: hace falta un SEGUNDO nivel de "alloy:" anidado (alloy.alloy.*, no solo
# alloy.*) — el propio chart de Alloy namespacea igual sus valores bajo su
# propia clave interna "alloy:" (se ve en templates/configmap.yaml:
# "$values := .Values.alloy"), lo mismo que hace Loki con su "loki:" interno.
# Sin este segundo nivel, la plantilla no encuentra nuestro "configMap.content"
# y cae al ejemplo de fábrica (config/example.alloy) sin avisar de nada — se
# detectó comparando el ConfigMap ya aplicado en el clúster contra un "helm
# template" con cero overrides: eran idénticos.
#
# Namespace "monitoring", igual que Prometheus/Grafana/Loki.
alloy:
  alloy:
    # Puertos OTLP para recibir trazas — el Service "alloy" (puerto 4317/4318)
    # es a donde car-api/sport-api mandarán sus trazas más adelante.
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    # controller.type ya viene en "daemonset" por defecto en el chart — una
    # copia del agente por nodo, para que cada uno recolecte los logs de los
    # Pods que corren en él. Aquí solo hay un nodo (OrbStack), pero es el
    # patrón real de un clúster de producción con varios.

    # Configuración de Alloy en su propio lenguaje ("Alloy configuration",
    # sintaxis River) — el equivalente aquí a un pipeline: descubre los Pods
    # del clúster, les añade etiquetas útiles (namespace/pod/contenedor/nodo)
    # y empuja sus logs a Loki. Validado en local con "alloy validate" (el
    # propio binario, vía Docker) antes de publicar, sin depender del clúster
    # para comprobar que la sintaxis es correcta.
    configMap:
      content: |-
        // Descubre todos los Pods del clúster vía la API de Kubernetes (no
        // hace falta montar /var/log del nodo: loki.source.kubernetes de más
        // abajo lee los logs directamente de la API, igual que "kubectl logs").
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Añade como etiquetas de cada log de dónde viene exactamente, para
        // poder filtrar luego en Grafana (ej. {namespace="car-api"}).
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
        }

        // Lee los logs de cada Pod ya etiquetado y los manda al siguiente
        // componente (loki.write).
        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        // Empuja los logs a Loki (mismo Service que ya desplegamos en
        // platform/loki/, sin gateway delante, puerto 3100).
        loki.write "default" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // Fase D: recibe trazas OTLP de car-api/sport-api (puertos estándar
        // 4317 grpc / 4318 http, expuestos vía alloy.service.extraPorts más
        // abajo) y las reenvía a Tempo. Nada de descubrimiento aquí — a
        // diferencia de los logs, las trazas las mandan las apps por su
        // cuenta (push), Alloy solo hace de intermediario.
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo.monitoring.svc.cluster.local:4317"
            tls {
              // Tráfico interno del clúster, sin certificado — mismo
              // criterio que loki.write de arriba (sin TLS hacia Loki).
              insecure = true
            }
          }
        }
