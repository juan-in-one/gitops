apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-in-one/gitops.git
    targetRevision: main
    path: platform/kyverno
    helm:
      releaseName: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno declara CRDs muy grandes (ej. ClusterPolicy, con todo su
      # esquema de validación embebido) — con el "kubectl apply" normal
      # (client-side, que guarda la configuración completa anterior en una
      # anotación) esto falla con "metadata.annotations: Too long: must have
      # at most 262144 bytes". ServerSideApply es la solución recomendada
      # por el propio proyecto Kyverno para instalarse vía ArgoCD.
      - ServerSideApply=true
  # Falso positivo conocido: el API server añade "spec.conversion:
  # {strategy: None}" a cualquier CRD que no lo declare, así que el objeto
  # "vivo" siempre tiene ese campo aunque el manifiesto deseado no lo
  # mencione — ArgoCD lo marcaba como OutOfSync permanente en las 22 CRDs de
  # Kyverno sin que hubiera ninguna diferencia real (verificado comparando
  # live vs. "helm template" campo a campo).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
