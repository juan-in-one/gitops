apiVersion: v2
name: postgres
description: >
  Postgres compartido de la plataforma juan-in-one — una única instancia usada
  por todos los microservicios (car-api, sport-api, ...), cada uno con su
  propio usuario/base de datos lógica dentro de ella (nunca comparten esquema).
  Wrapper del chart oficial de Bitnami en vez de un StatefulSet escrito a mano.
type: application
version: 0.1.0
dependencies:
  - name: postgresql
    # Bitnami retiró Postgres 16 de su catálogo gratuito a mediados de 2025;
    # 17.6.0 es la única versión que sigue disponible sin pago (registro
    # "bitnamilegacy", ver values.yaml). Ver wiki/projects/juan-in-one.md.
    version: "16.7.27" # empaqueta Postgres 17.6.0
    repository: https://charts.bitnami.com/bitnami
