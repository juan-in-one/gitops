# ClusterPolicy propia (no forma parte del chart oficial de Kyverno, que
# solo instala el controlador — las políticas se declaran aparte, igual que
# el ConfigMap del dashboard de Grafana se añade como plantilla extra en el
# wrapper de monitoring).
#
# Cierra la cadena de suministro: Trivy dice qué vulnerabilidades tiene una
# imagen, Cosign la firma en el CI — esta política es lo que de verdad
# comprueba esa firma antes de admitir un Pod. Sin ella, firmar imágenes es
# solo "información bonita" que nadie verifica.
#
# failureAction: Audit a propósito (no Enforce todavía): registra en un
# PolicyReport qué bloquearía sin bloquear nada real, para verificarlo con
# tráfico real del clúster antes de que pueda tumbar un despliegue por un
# fallo de configuración de la propia política.
#
# mutateDigest: false a propósito, de momento: por defecto Kyverno además
# reescribiría la imagen del Pod a su digest resuelto (image@sha256:...) en
# vez del tag — un efecto colateral real sobre lo desplegado que conviene
# decidir aparte, no colarlo dentro de esta primera verificación en modo
# Audit.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verificar firma de Cosign (juan-in-one)
    policies.kyverno.io/description: >-
      Solo admite Pods cuya imagen esté firmada por el CI de juan-in-one
      (Cosign, keyless vía OIDC de GitHub Actions) — ver el workflow
      reutilizable fastapi-service-ci.yml en juan-in-one/.github y el
      ci.yml propio de web.
spec:
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  rules:
    # car-api, sport-api y academy-api comparten el mismo workflow
    # reutilizable (juan-in-one/.github), así que la identidad de la firma
    # es la MISMA para los tres — no es la del ci.yml de cada API, es la
    # del propio workflow reutilizable que de verdad ejecuta el job
    # (verificado con "cosign verify" antes de escribir esto, no a ciegas).
    - name: verify-apis-python
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - car-api
                - sport-api
                - academy-api
      verifyImages:
        - imageReferences:
            - "ghcr.io/juan-in-one/car-api*"
            - "ghcr.io/juan-in-one/sport-api*"
            - "ghcr.io/juan-in-one/academy-api*"
          failureAction: Audit
          mutateDigest: false
          # RBAC solo no basta: hace falta decirle explícitamente qué
          # Secret usar para autenticarse en ghcr.io (notación
          # namespace/nombre) — comprobado en los logs reales del
          # admission-controller que sin esto sigue dando "UNAUTHORIZED"
          # aunque el ServiceAccount ya pueda leer el Secret.
          imageRegistryCredentials:
            secrets:
              - car-api/ghcr-pull
              - sport-api/ghcr-pull
              - academy-api/ghcr-pull
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/juan-in-one/.github/.github/workflows/fastapi-service-ci.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev

    # web tiene su propio ci.yml (no es un workflow reutilizable), así que
    # su identidad de firma es distinta.
    - name: verify-web
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - web
      verifyImages:
        - imageReferences:
            - "ghcr.io/juan-in-one/web*"
          failureAction: Audit
          mutateDigest: false
          imageRegistryCredentials:
            secrets:
              - web/ghcr-pull
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/juan-in-one/web/.github/workflows/ci.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
