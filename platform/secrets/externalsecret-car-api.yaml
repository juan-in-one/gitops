# Crea el Secret "car-api" en el namespace "car-api" — mismo nombre y misma
# clave (database-url) que el Secret que antes escribíamos a mano en
# car-api/chart/templates/secret.yaml, así el Deployment de car-api no
# necesita cambiar nada para leerlo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: car-api
  namespace: car-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: car-api
    creationPolicy: Owner
    template:
      # "template" monta el valor final combinando el secreto real (Vault)
      # con el resto de la URL de conexión, que no es sensible en sí mismo.
      data:
        database-url: "postgresql+asyncpg://car_api:{{ .password }}@postgres-postgresql.platform.svc.cluster.local:5432/car_api"
  data:
    - secretKey: password # variable que se usa arriba, en el template
      remoteRef:
        key: postgres
        property: car-api-password
