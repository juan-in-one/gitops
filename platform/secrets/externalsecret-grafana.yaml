# Crea el Secret "grafana-admin-credentials" en el namespace "monitoring",
# trayendo la contraseña real desde Vault (secret/grafana). El chart de
# kube-prometheus-stack (grafana.admin.existingSecret) lo leerá en vez de
# generar una contraseña aleatoria él mismo — mismo patrón que postgres/car-api.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      # "admin-user" no es secreto (es literalmente "admin"), pero el chart
      # exige que ambas claves vivan en el mismo Secret (admin.userKey/
      # admin.passwordKey), así que se fija aquí junto a la contraseña real.
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: grafana # secret/data/grafana dentro de Vault
        property: admin-password
