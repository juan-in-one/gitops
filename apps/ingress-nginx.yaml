apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    # Chart oficial referenciado directo desde su repo de Helm — mismo patrón
    # que metrics-server, sin wrapper propio.
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: "4.15.1"
    helm:
      valuesObject:
        controller:
          # En OrbStack, el Service type LoadBalancer del controlador recibe
          # una IP local reservada automáticamente (a diferencia de un
          # clúster cloud real, donde la asignaría el proveedor).
          service:
            type: LoadBalancer
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
