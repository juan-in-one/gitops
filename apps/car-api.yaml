apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: car-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-in-one/car-api.git
    targetRevision: main
    path: chart
    helm:
      releaseName: car-api
      # El Secret "car-api" (con DATABASE_URL) ya no lo crea este values
      # override — lo crea External Secrets Operator desde Vault, ver
      # platform/secrets/externalsecret-car-api.yaml.
      valuesObject:
        ingress:
          enabled: false # sin controlador de Ingress instalado todavía en OrbStack
        imagePullSecrets:
          # Secret dockerconfigjson creado directo en el clúster (no en Git,
          # namespace car-api) con credenciales de lectura del paquete
          # privado de GHCR: kubectl create secret docker-registry ghcr-pull...
          - name: ghcr-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: car-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
