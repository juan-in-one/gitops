# Valores para el chart oficial (namespace "kube-prometheus-stack", nombre de
# la dependencia declarada en Chart.yaml). Solo lo mínimo para arrancar en un
# clúster local de un solo nodo — se irá ampliando en fases posteriores.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d # suficiente para practicar sin llenar el disco del portátil
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 5Gi

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 1Gi
    # Sin receptores configurados todavía (Slack/email/...) — eso es la Fase D
    # del roadmap. De momento solo queda desplegado, sin avisar a nadie.

  grafana:
    persistence:
      enabled: true
      size: 1Gi

    # Contraseña real gestionada en Vault, traída por External Secrets
    # Operator (ver platform/secrets/externalsecret-grafana.yaml) — mismo
    # patrón que postgres/car-api. Recuperarla con:
    #   kubectl get secret grafana-admin-credentials -n monitoring \
    #     -o jsonpath='{.data.admin-password}' | base64 -d
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password

    # Un único host para toda la plataforma, mismo patrón que web/car-api/
    # sport-api (ver gitops/apps/car-api.yaml): el prefijo /grafana solo
    # existe a nivel de Ingress, ingress-nginx fusiona esta regla con las de
    # los demás porque comparten host.
    ingress:
      enabled: true
      ingressClassName: nginx
      path: "/grafana(/|$)(.*)"
      pathType: ImplementationSpecific
      hosts:
        - juan-in-one.local
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2

    # A diferencia de car-api/sport-api (APIs sin enlaces propios), Grafana sí
    # genera enlaces/assets asumiendo dónde vive — sin esto, tras el rewrite
    # de arriba, pediría sus JS/CSS en "/" en vez de "/grafana/" y la UI se
    # rompería.
    "grafana.ini":
      server:
        domain: juan-in-one.local
        root_url: "%(protocol)s://%(domain)s/grafana/"
        # false (no true): el Ingress YA quita el prefijo /grafana antes de
        # reenviar a Grafana (rewrite-target /$2 de arriba), así que Grafana
        # debe comportarse como si viviera en la raíz. root_url solo se usa
        # para generar enlaces absolutos correctos hacia fuera. Con "true" (lo
        # que se puso primero) Grafana espera gestionar el prefijo él mismo
        # -> nunca lo recibe -> bucle de redirects en /grafana/login.
        serve_from_sub_path: false

    # "Loki" ya existía (Fase C) con un uid generado al azar por Grafana —
    # declarar ahora "uid: loki" en additionalDataSources no lo cambia
    # retroactivamente (Grafana no reescribe el uid de algo que ya existe),
    # así que Tempo no podría encontrarlo por ese nombre más abajo. Se borra
    # y se vuelve a crear desde cero (sin perder nada: es solo el registro de
    # conexión en Grafana, no datos de Loki) para que nazca ya con el uid
    # fijo que necesitamos — visto comparando los logs de Grafana
    # ("Datasource provisioning error: data source not found") contra
    # GET /api/datasources, que mostró el uid real (P8E80F9AEF21F6940).
    deleteDatasources:
      - name: Loki
        orgId: 1

    # Loki y Tempo no vienen incluidos en kube-prometheus-stack (solo
    # Prometheus, que sí se provisiona solo) — se añaden como fuentes de
    # datos extra. "uid" fijo en los dos porque Tempo necesita referenciar a
    # Loki por su uid exacto para la correlación traza → logs de más abajo.
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        editable: false
        jsonData:
          # Fase D: desde una traza en Tempo, poder saltar directo a los
          # logs de esa misma petición en Loki. "tags" dice cómo traducir un
          # atributo de la traza (service.name, ej. "car-api") a una
          # etiqueta de Loki (namespace) — mismo valor en los dos casos
          # porque así se llamó cada namespace, no hace falta más mapeo.
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: namespace
            filterByTraceID: false
            filterBySpanID: false
