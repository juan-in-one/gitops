# Primera vez que se gestiona algo del propio ArgoCD vía GitOps (el resto
# de esta instalación se hizo a mano el 2026-08-20, "bootstrap" inicial e
# inevitable de cualquier GitOps: algo tiene que existir antes de que ArgoCD
# pueda vigilar nada). A partir de aquí, esta ConfigMap concreta sí vive en
# Git como el resto de la plataforma.
#
# Solo hace falta "insecure": ArgoCD tiene su propio subdominio
# (argocd.juan-in-one.local, ver platform/argocd/ingress.yaml), sirviendo en
# la raíz "/" — no necesita basehref/rootpath (eso era para servirlo bajo un
# prefijo tipo /argocd en el host compartido, se probó y se descartó: la UI
# de ArgoCD no aplicaba bien esos ajustes y cargaba rota, ver log.md
# 2026-09-05).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
