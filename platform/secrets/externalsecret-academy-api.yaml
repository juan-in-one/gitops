# Crea el Secret "academy-api" en el namespace "academy-api" — mismo patrón
# que car-api/sport-api (ver externalsecret-car-api.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: academy-api
  namespace: academy-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: academy-api
    creationPolicy: Owner
    template:
      data:
        database-url: "postgresql+asyncpg://academy_api:{{ .password }}@postgres-postgresql.platform.svc.cluster.local:5432/academy_api"
  data:
    - secretKey: password
      remoteRef:
        key: postgres
        property: academy-api-password
