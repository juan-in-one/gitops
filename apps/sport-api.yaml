apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sport-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-in-one/sport-api.git
    targetRevision: main
    path: chart
    helm:
      releaseName: sport-api
      # El Secret "sport-api" (con DATABASE_URL) lo crea External Secrets
      # Operator desde Vault, ver platform/secrets/externalsecret-sport-api.yaml.
      valuesObject:
        image:
          # Tag inmutable del commit publicado — con "latest" (el valor por
          # defecto del chart) Kubernetes no detecta que hay imagen nueva y
          # no la redespliega. Ver gitops/apps/web.yaml y log.md 2026-08-27.
          tag: sha-e13a00f
        ingress:
          enabled: true
          # Mismo host que car-api/web — ingress-nginx fusiona las reglas de
          # varios Ingress que comparten host en una sola configuración.
          host: juan-in-one.local
          path: "/api/sport-api(/|$)(.*)"
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /$2
        imagePullSecrets:
          # Secret dockerconfigjson creado directo en el clúster (no en Git,
          # namespace sport-api) con credenciales de lectura del paquete
          # privado de GHCR: kubectl create secret docker-registry ghcr-pull...
          - name: ghcr-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: sport-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
