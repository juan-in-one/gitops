# A diferencia de web/car-api/sport-api/grafana (que comparten el host
# juan-in-one.local por prefijo), ArgoCD tiene su propio subdominio y sirve
# en la raíz "/". Se probó primero con prefijo (/argocd en el host
# compartido) y se descartó: la UI de ArgoCD no aplicaba bien basehref/
# rootpath y cargaba rota (ver log.md 2026-09-05) — un subdominio propio
# sirviendo en "/" evita el problema de raíz, sin necesitar esos ajustes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # ArgoCD habla gRPC-Web además de HTTP normal desde el navegador; este
    # backend-protocol le dice a ingress-nginx que no intente forzar HTTP/2
    # ni nada especial, tráfico HTTP normal basta con server.insecure=true.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.juan-in-one.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
