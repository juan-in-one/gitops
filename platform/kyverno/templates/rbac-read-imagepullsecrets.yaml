# Sin esto, verifyImages falla siempre con "UNAUTHORIZED: authentication
# required" al consultar ghcr.io (registro privado) — verificado en los
# logs reales del admission-controller antes de escribir esto, no a ciegas.
#
# Desde Kyverno 1.18, el controlador usa automáticamente los
# "imagePullSecrets" ya declarados en el propio Pod (el "ghcr-pull" que ya
# existe en cada namespace, el mismo que usa Kubernetes para descargar la
# imagen) para autenticarse en el registro al verificar la firma — no hace
# falta duplicar el secreto en el namespace "kyverno". Lo único que falta es
# el permiso RBAC para que el ServiceAccount del admission-controller pueda
# leer Secrets en el namespace de cada microservicio.
{{- range list "car-api" "sport-api" "academy-api" "web" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-read-imagepullsecrets
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-read-imagepullsecrets
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-read-imagepullsecrets
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
{{- end }}
