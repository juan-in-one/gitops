# Crea el Secret "sport-api" en el namespace "sport-api" — mismo nombre y
# misma clave (database-url) que espera el Deployment del chart de sport-api.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sport-api
  namespace: sport-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sport-api
    creationPolicy: Owner
    template:
      # "template" monta el valor final combinando el secreto real (Vault)
      # con el resto de la URL de conexión, que no es sensible en sí mismo.
      data:
        database-url: "postgresql+asyncpg://sport_api:{{ .password }}@postgres-postgresql.platform.svc.cluster.local:5432/sport_api"
  data:
    - secretKey: password # variable que se usa arriba, en el template
      remoteRef:
        key: postgres
        property: sport-api-password
