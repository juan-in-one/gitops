# Crea el Secret "postgres-credentials" en el namespace "platform", trayendo
# los valores reales desde Vault (secret/postgres). El chart de Postgres
# (auth.existingSecret) lo leerá en vez de tener la contraseña en values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: platform
spec:
  refreshInterval: 1h # cada cuánto revisa ESO si el valor en Vault cambió
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password # clave dentro del Secret de Kubernetes
      remoteRef:
        key: postgres # secret/data/postgres dentro de Vault
        property: postgres-password # campo concreto dentro de ese secreto
    - secretKey: password
      remoteRef:
        key: postgres
        property: car-api-password
