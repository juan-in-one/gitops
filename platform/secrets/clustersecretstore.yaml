# Conecta External Secrets Operator con Vault. "Cluster" (no namespaced) para
# que cualquier namespace del clúster pueda usarlo (car-api, platform, y los
# microservicios futuros), definido una sola vez.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret # el secrets engine KV v2 que activamos dentro de Vault
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes # el auth method que activamos dentro de Vault
          role: eso-role
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
